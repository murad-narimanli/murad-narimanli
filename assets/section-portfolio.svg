<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Selected portfolio section</title>
  <desc id="desc">Selected portfolio heading.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081321"/>
      <stop offset="1" stop-color="#10233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <style>
      .title { font: 800 38px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .text { font: 600 17px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .mono { font: 700 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #bbf7d0; }
    </style>
  </defs>
  <rect width="1200" height="180" rx="26" fill="url(#bg)"/>
  <path d="M58 118C230 72 338 152 508 116C688 78 860 70 1142 112" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <text x="58" y="64" class="title">Selected Portfolio</text>
  <text x="58" y="100" class="text">Clickable project cards from banking, fintech, gaming, and enterprise work.</text>
  <rect x="884" y="48" width="258" height="72" rx="18" fill="#102943" stroke="#2b5972"/>
  <text x="914" y="78" class="mono">open(project)</text>
  <rect x="1034" y="64" width="10" height="20" rx="2" fill="#a3e635"/>
</svg>
