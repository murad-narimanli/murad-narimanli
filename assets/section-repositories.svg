<svg width="1200" height="180" viewBox="0 0 1200 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub repositories section</title>
  <desc id="desc">Selected GitHub repositories by Murad Narimanli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081321"/>
      <stop offset="1" stop-color="#10233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <style>
      .title { font: 800 38px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .text { font: 600 17px Arial, Helvetica, sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .mono { font: 700 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #bbf7d0; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1200" height="180" rx="26" fill="url(#bg)"/>
  <path d="M58 118C230 84 358 132 520 112C714 88 902 88 1142 116" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.82"/>
  <text x="58" y="64" class="title">GitHub Repositories</text>
  <text x="58" y="100" class="text">Practical frontend systems, architecture demos, testing, performance, and banking examples.</text>
  <rect x="878" y="48" width="264" height="72" rx="18" fill="#102943" stroke="#2b5972"/>
  <text x="908" y="78" class="mono">murad-narimanli/*</text>
  <text x="908" y="104" class="mono">TypeScript projects</text>
</svg>
