<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Contact panel</title>
  <desc id="desc">Colored intro and contact panel for Murad Narimanli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#10233b"/>
      <stop offset="1" stop-color="#0b1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <style>
      .title { font: 800 42px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .role { font: 800 21px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .copy { font: 600 19px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .button { font: 800 21px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .tiny { font: 800 12px Arial, Helvetica, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <path d="M70 64H1130" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="56 24">
    <animate attributeName="stroke-dashoffset" values="0;-240" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="52" text-anchor="middle" class="title">Hi, I'm Murad Narimanli</text>
  <text x="600" y="100" text-anchor="middle" class="role">Senior Frontend Developer / Frontend Chapter Lead</text>
  <text x="600" y="130" text-anchor="middle" class="copy">Building high-scale fintech, banking, enterprise, and gaming platforms.</text>

  <g transform="translate(180 166)">
    <rect width="230" height="56" rx="28" fill="#102943" stroke="#22d3ee" stroke-width="2" stroke-dasharray="50 18">
      <animate attributeName="stroke-dashoffset" values="0;-136" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="38" cy="28" r="11" fill="#22d3ee"/>
    <text x="130" y="36" text-anchor="middle" class="button">Portfolio</text>
  </g>
  <g transform="translate(485 166)">
    <rect width="230" height="56" rx="28" fill="#102943" stroke="#38bdf8" stroke-width="2" stroke-dasharray="50 18">
      <animate attributeName="stroke-dashoffset" values="0;-136" dur="5.4s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#38bdf8">in</text>
    <text x="130" y="36" text-anchor="middle" class="button">LinkedIn</text>
  </g>
  <g transform="translate(790 166)">
    <rect width="230" height="56" rx="28" fill="#102943" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="50 18">
      <animate attributeName="stroke-dashoffset" values="0;-136" dur="5.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="38" cy="28" r="11" fill="#cbd5e1"/>
    <text x="130" y="36" text-anchor="middle" class="button">GitHub</text>
  </g>

  <g transform="translate(180 246)">
    <rect width="230" height="56" rx="28" fill="#102943" stroke="#f97316" stroke-width="2" stroke-dasharray="50 18">
      <animate attributeName="stroke-dashoffset" values="0;-136" dur="5.2s" repeatCount="indefinite"/>
    </rect>
    <path d="M27 22H49V37H27V22Z" fill="#facc15"/>
    <path d="M28 23L38 31L48 23" stroke="#0f2237" stroke-width="2" stroke-linecap="round"/>
    <text x="130" y="36" text-anchor="middle" class="button">Email</text>
  </g>
  <g transform="translate(485 246)">
    <rect width="230" height="56" rx="28" fill="#102943" stroke="#22d3ee" stroke-width="2" stroke-dasharray="50 18">
      <animate attributeName="stroke-dashoffset" values="0;-136" dur="5.1s" repeatCount="indefinite"/>
    </rect>
    <path d="M25 28L51 17L45 41L38 34L32 39L34 31L46 21L31 30L25 28Z" fill="#38bdf8"/>
    <text x="130" y="36" text-anchor="middle" class="button">Telegram</text>
  </g>
  <g transform="translate(790 246)">
    <rect width="230" height="56" rx="28" fill="#102943" stroke="#22c55e" stroke-width="2" stroke-dasharray="50 18">
      <animate attributeName="stroke-dashoffset" values="0;-136" dur="5.3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="38" cy="28" r="14" fill="#22c55e"/>
    <path d="M33 22C29 26 30 33 34 36L32 42L39 40C44 42 50 37 50 30C50 22 40 16 33 22Z" fill="#f8fafc"/>
    <text x="130" y="36" text-anchor="middle" class="button">WhatsApp</text>
  </g>
