<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Education and languages section</title>
  <desc id="desc">Animated education and languages panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#10233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.54" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <style>
      .title { font: 800 38px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .headline { font: 800 22px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .text { font: 600 16px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .small { font: 600 15px Arial, Helvetica, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="26" fill="url(#bg)"/>
  <path d="M46 83H1154" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="36 18">
    <animate attributeName="stroke-dashoffset" values="0;-216" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="58" y="60" class="title">Education and Languages</text>

  <g transform="translate(58 112)">
    <rect width="520" height="96" rx="18" fill="#102943" stroke="#2b5972"/>
    <circle cx="38" cy="38" r="12" fill="#22d3ee">
      <animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="40" class="headline">Programming and Automation</text>
    <text x="66" y="68" class="text">Master degree | ASOIU | 2020 - 2022</text>
  </g>
  <g transform="translate(622 112)">
    <rect width="520" height="96" rx="18" fill="#102943" stroke="#2b5972"/>
    <circle cx="38" cy="38" r="12" fill="#a3e635">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="66" y="40" class="headline">Telecommunication Engineering</text>
    <text x="66" y="68" class="text">Bachelor degree | ASOIU | 2016 - 2020</text>
  </g>
  <text x="58" y="236" class="small">Languages: English, Russian</text>
</svg>
