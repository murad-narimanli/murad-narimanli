<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot section</title>
  <desc id="desc">Animated summary of Murad Narimanli's frontend focus areas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081321"/>
      <stop offset="1" stop-color="#10233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <style>
      .title { font: 800 38px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .text { font: 600 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .label { font: 800 24px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .small { font: 600 14px Arial, Helvetica, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#grid)"/>
  <path d="M56 78C220 28 344 104 486 76C650 44 778 28 1144 72" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="34 20">
    <animate attributeName="stroke-dashoffset" values="0;-216" dur="9s" repeatCount="indefinite"/>
  </path>

  <text x="58" y="70" class="title">Snapshot</text>
  <text x="58" y="108" class="text">7+ years building high-scale frontend systems across fintech, banking, enterprise, and gaming.</text>

  <g transform="translate(58 144)">
    <rect width="342" height="116" rx="18" fill="#102943" stroke="#2b5972"/>
    <circle cx="42" cy="38" r="13" fill="#22d3ee">
      <animate attributeName="r" values="11;15;11" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="42" class="label">Banking and fintech</text>
    <text x="28" y="72" class="small">
      <tspan x="28" dy="0">Internet banking, dashboards</tspan>
      <tspan x="28" dy="22">Reporting tools and secure UI</tspan>
    </text>
  </g>

  <g transform="translate(429 144)">
    <rect width="342" height="116" rx="18" fill="#102943" stroke="#2b5972"/>
    <circle cx="42" cy="38" r="13" fill="#a3e635">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="42" class="label">Gaming platforms</text>
    <text x="28" y="72" class="small">
      <tspan x="28" dy="0">Real-time data and user flows</tspan>
      <tspan x="28" dy="22">Reusable UI systems</tspan>
    </text>
  </g>

  <g transform="translate(800 144)">
    <rect width="342" height="116" rx="18" fill="#102943" stroke="#2b5972"/>
    <circle cx="42" cy="38" r="13" fill="#f97316">
      <animate attributeName="r" values="13;10;13" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="42" class="label">Frontend architecture</text>
    <text x="28" y="72" class="small">
      <tspan x="28" dy="0">Microfrontends, CI/CD</tspan>
      <tspan x="28" dy="22">API-heavy products</tspan>
    </text>
  </g>
</svg>
