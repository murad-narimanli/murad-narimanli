<svg width="1200" height="190" viewBox="0 0 1200 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Get my resume</title>
  <desc id="desc">Clickable animated resume card for Murad Narimanli.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#10233b"/>
      <stop offset="1" stop-color="#0b1727"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.42 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <style>
      .eyebrow { font: 800 13px Arial, Helvetica, sans-serif; fill: #94a3b8; letter-spacing: 0; }
      .title { font: 900 36px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .copy { font: 600 18px Arial, Helvetica, sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .button { font: 900 19px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .tiny { font: 800 12px Arial, Helvetica, sans-serif; fill: #bbf7d0; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1200" height="190" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="190" rx="24" fill="url(#grid)"/>
  <rect x="26" y="20" width="1148" height="150" rx="22" fill="#102943" fill-opacity="0.52" stroke="url(#accent)" stroke-width="3" stroke-dasharray="76 28">
    <animate attributeName="stroke-dashoffset" values="0;-208" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(78 56)" filter="url(#glow)">
    <rect x="0" y="0" width="62" height="78" rx="12" fill="#0d1b2d" stroke="#38bdf8" stroke-width="2"/>
    <path d="M42 0L62 20H46C44 20 42 18 42 16V0Z" fill="#1e8fb7"/>
    <rect x="14" y="28" width="34" height="5" rx="2.5" fill="#a3e635"/>
    <rect x="14" y="42" width="28" height="5" rx="2.5" fill="#38bdf8"/>
    <rect x="14" y="56" width="22" height="5" rx="2.5" fill="#f97316"/>
  </g>

  <g transform="translate(170 55)">
    <text x="0" y="0" class="eyebrow">FLOWCV RESUME</text>
    <text x="0" y="42" class="title">Get my resume</text>
    <text x="0" y="76" class="copy">Full frontend leadership CV with banking, gaming,</text>
    <text x="0" y="102" class="copy">microfrontend, and delivery experience.</text>
  </g>

  <g transform="translate(902 58)">
    <rect width="198" height="62" rx="31" fill="#0d1b2d" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="86" y="39" text-anchor="middle" class="button">OPEN CV</text>
    <path d="M142 24L157 39L142 54" stroke="#a3e635" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(918 142)" opacity="0.7">
    <circle cx="0" cy="0" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.28;1;0.28" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="5" class="tiny">AVAILABLE ONLINE</text>
  </g>
</svg>
