<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn link</title>
  <desc id="desc">Animated LinkedIn link button.</desc>
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="180" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="176" height="44" rx="22" fill="#0f2237"/>
  <rect x="2" y="2" width="176" height="44" rx="22" stroke="url(#stroke)" stroke-width="2" stroke-dasharray="52 18">
    <animate attributeName="stroke-dashoffset" values="0;-140" dur="5.4s" repeatCount="indefinite"/>
  </rect>
  <text x="29" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#38bdf8">in</text>
  <text x="98" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">LinkedIn</text>
</svg>
