<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Murad Narimanli animated profile banner</title>
  <desc id="desc">Animated GitHub profile banner for a senior frontend developer focused on banking, gaming, APIs, and microfrontends.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#10233b"/>
      <stop offset="1" stop-color="#0b1727"/>
      <animate attributeName="x1" values="0;120;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;1080;1200" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.48" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172940" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d1b2d" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.83 0 0 0 0 0.93 0 0 0 0.6 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .headline { font: 800 60px Arial, Helvetica, sans-serif; letter-spacing: 0; fill: #f8fafc; }
      .subhead { font: 500 24px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .small { font: 600 17px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .mono { font: 600 16px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #bbf7d0; }
      .muted { fill: #94a3b8; font: 600 14px Arial, Helvetica, sans-serif; }
      .tiny { fill: #94a3b8; font: 700 12px Arial, Helvetica, sans-serif; }
      .metric { fill: #f8fafc; font: 800 18px Arial, Helvetica, sans-serif; }
      .chip { fill: #0f253b; stroke: #335168; stroke-width: 1; }
      .blink { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <g opacity="0.72">
    <circle cx="380" cy="35" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="398" y="40" class="tiny">LIVE SYSTEMS</text>
    <rect x="520" y="24" width="104" height="24" rx="12" fill="#102943" stroke="#2b5972"/>
    <text x="572" y="41" class="tiny" text-anchor="middle">7+ YEARS</text>
    <rect x="642" y="24" width="126" height="24" rx="12" fill="#102943" stroke="#2b5972"/>
    <text x="705" y="41" class="tiny" text-anchor="middle">BANKING UI</text>
    <rect x="786" y="24" width="158" height="24" rx="12" fill="#102943" stroke="#2b5972"/>
    <text x="865" y="41" class="tiny" text-anchor="middle">MICROFRONTENDS</text>
  </g>

  <g opacity="0.32">
    <path d="M10 86 C160 44 270 144 420 96 S690 44 850 96 1080 150 1240 92" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="34 22">
      <animate attributeName="stroke-dashoffset" values="0;-224" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.26">
    <path d="M-80 314 C80 266 218 342 360 306 S656 238 830 300 1086 348 1280 286" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 18">
      <animate attributeName="stroke-dashoffset" values="0;192" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(58 56)">
    <path d="M22 112C68 42 154 34 212 84C270 134 314 102 344 58" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="18 16">
      <animate attributeName="stroke-dashoffset" values="0;-170" dur="5.8s" repeatCount="indefinite"/>
    </path>
    <path d="M58 44C77 18 116 18 134 48C156 42 178 56 181 80H41C43 62 48 51 58 44Z" fill="#132c46" stroke="#2b5972" opacity="0.72"/>
    <path d="M238 132C254 108 290 108 306 136C326 132 346 145 350 166H223C225 151 230 140 238 132Z" fill="#132c46" stroke="#2b5972" opacity="0.62"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;18 -10;0 0" dur="3.4s" repeatCount="indefinite"/>
      <path d="M171 86L303 36C315 32 322 46 311 53L258 88L284 131C288 138 279 145 273 139L234 104L195 130C187 136 177 127 183 118L207 83L171 94C165 96 164 88 171 86Z" fill="#f8fafc"/>
      <path d="M206 83L258 88L234 104L207 83Z" fill="#22d3ee"/>
      <path d="M258 88L311 53L273 139L258 88Z" fill="#a3e635" opacity="0.92"/>
      <path d="M183 118L207 83L195 130L183 118Z" fill="#f97316" opacity="0.95"/>
    </g>
    <circle cx="24" cy="112" r="7" fill="#22d3ee" filter="url(#softGlow)">
      <animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="344" cy="58" r="7" fill="#a3e635" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="72" y="250" class="headline">Murad Narimanli</text>
  <text x="76" y="292" class="subhead">Senior Frontend Developer / Chapter Lead</text>
  <text x="76" y="330" class="small">Vue 2/3 | React | Next.js | Angular | Microfrontends | REST | GraphQL</text>

  <g transform="translate(76 338)" opacity="0.86">
    <rect x="0" y="0" width="438" height="4" rx="2" fill="#18324c"/>
    <rect x="0" y="0" width="120" height="4" rx="2" fill="#22d3ee">
      <animate attributeName="width" values="120;438;120" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.62;1;0.62" dur="5.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(76 356)">
    <rect class="chip" x="0" y="0" width="128" height="34" rx="17"/>
    <text class="muted" x="64" y="22" text-anchor="middle">Banking</text>
    <rect class="chip" x="144" y="0" width="126" height="34" rx="17"/>
    <text class="muted" x="207" y="22" text-anchor="middle">Gaming</text>
    <rect class="chip" x="286" y="0" width="144" height="34" rx="17"/>
    <text class="muted" x="358" y="22" text-anchor="middle">Enterprise UI</text>
  </g>

  <g transform="translate(690 58)">
    <rect width="418" height="252" rx="22" fill="url(#card)" stroke="#5b7892" stroke-opacity="0.38"/>
    <rect x="0" y="0" width="418" height="50" rx="22" fill="#102238"/>
    <circle cx="29" cy="25" r="6" fill="#f97316"/>
    <circle cx="51" cy="25" r="6" fill="#facc15"/>
    <circle cx="73" cy="25" r="6" fill="#22c55e"/>
    <text x="104" y="31" class="muted">frontend-architecture.ts</text>

    <text x="32" y="88" class="mono">const stack = [</text>
    <text x="54" y="118" class="mono">"Vue", "React", "Next.js",</text>
    <text x="54" y="148" class="mono">"Angular", "GraphQL"</text>
    <text x="32" y="178" class="mono">];</text>
    <text x="32" y="216" class="mono">ship(product).withScale();</text>
    <rect x="252" y="202" width="11" height="22" rx="2" fill="#a3e635" class="blink"/>

    <g transform="translate(302 76)">
      <rect width="82" height="84" rx="14" fill="#0f253b" stroke="#335168"/>
      <text x="41" y="28" text-anchor="middle" class="tiny">LOAD</text>
      <text x="41" y="55" text-anchor="middle" class="metric">98%</text>
      <rect x="18" y="66" width="46" height="4" rx="2" fill="#18324c"/>
      <rect x="18" y="66" width="12" height="4" rx="2" fill="#a3e635">
        <animate attributeName="width" values="12;46;12" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <g transform="translate(858 302)">
    <rect x="0" y="0" width="116" height="58" rx="18" fill="#132c46" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="58" y="24" text-anchor="middle" class="muted">API</text>
    <text x="58" y="43" text-anchor="middle" class="small">REST</text>
  </g>
  <g transform="translate(988 302)">
    <rect x="0" y="0" width="138" height="58" rx="18" fill="#132c46" stroke="#a3e635" stroke-opacity="0.5"/>
    <text x="69" y="24" text-anchor="middle" class="muted">Scale</text>
    <text x="69" y="43" text-anchor="middle" class="small">CI/CD</text>
  </g>
  <g transform="translate(720 316)">
    <rect x="0" y="0" width="122" height="58" rx="18" fill="#132c46" stroke="#f97316" stroke-opacity="0.52"/>
    <text x="61" y="24" text-anchor="middle" class="muted">UI</text>
    <text x="61" y="43" text-anchor="middle" class="small">Systems</text>
  </g>
</svg>
