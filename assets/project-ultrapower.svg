<svg width="360" height="110" viewBox="0 0 360 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ultrapower project</title>
  <desc id="desc">Animated project card for Ultrapower.</desc>
  <defs><linearGradient id="s" x1="0" y1="0" x2="360" y2="110"><stop stop-color="#a3e635"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
  <rect x="2" y="2" width="356" height="106" rx="18" fill="#102943"/>
  <rect x="2" y="2" width="356" height="106" rx="18" stroke="url(#s)" stroke-width="2" stroke-dasharray="58 22"><animate attributeName="stroke-dashoffset" values="0;-220" dur="5.6s" repeatCount="indefinite"/></rect>
  <circle cx="40" cy="38" r="12" fill="#a3e635"><animate attributeName="r" values="10;14;10" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="68" y="43" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Ultrapower</text>
  <text x="68" y="72" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#94a3b8">Casino web platform</text>
  <text x="260" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#bbf7d0">Open</text>
</svg>
